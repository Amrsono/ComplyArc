[project]
name = "complyarc"
version = "1.3.1"
description = "ComplyArc — AI-Native AML & eKYC Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
pythonpath = ["apps/api"]
