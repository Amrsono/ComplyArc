name: CI Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint & Code Quality (ci_runs_lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Web Linter
        run: npm run lint

      - name: Run Dependency Audit (npm)
        run: npm audit --audit-level=critical

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.lock.txt

      - name: Install Python Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Python Linters
        working-directory: apps/api
        run: |
          ruff check .
          flake8 .

  typecheck:
    name: Typecheck & Production Build (ci_runs_typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck and Build
        run: npm run build

  test:
    name: Run Automated Tests & Coverage Gate (ci_runs_tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.lock.txt

      - name: Install Python Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install pip-audit

      - name: Run Security Audit (pip-audit)
        working-directory: apps/api
        run: |
          pip-audit -r requirements.lock.txt --desc on

      - name: Run Full Test Suite (ci_runs_tests)
        env:
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: test
        run: |
          npm run test:coverage
          cd apps/api && pytest tests/ -v --cov=app --cov-report=term --cov-fail-under=75
